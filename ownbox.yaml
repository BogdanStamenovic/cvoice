schema: 1
name: cvoice
description: Clone a voice from 20 seconds of speech, then speak any text in it
homepage: https://github.com/BogdanStamenovic/cvoice
tags: [cli, tts, voice-cloning, serbian, self-hosted, python]
install:
  platforms: [linux, darwin, windows]
  setup:
    linux:   [python3 install.py]
    darwin:  [python3 install.py]
    windows: [python install.py]
  update:
    linux:   [.venv/bin/python -m pip install -q -e .]
    darwin:  [.venv/bin/python -m pip install -q -e .]
    windows: [.venv\\Scripts\\python.exe -m pip install -q -e .]
  remove:
    linux:   [python3 uninstall.py --yes]
    darwin:  [python3 uninstall.py --yes]
    windows: [python uninstall.py --yes]
# cvoiced is deliberately absent: ownbox creates a launcher for every entry
# here, which on a client-only install would expose a daemon command whose
# dependencies were never installed. install.py links it for server roles.
commands:
  reci:
    linux:   .venv/bin/reci
    darwin:  .venv/bin/reci
    windows: .venv\\Scripts\\reci.exe
  cvoice:
    linux:   .venv/bin/cvoice
    darwin:  .venv/bin/cvoice
    windows: .venv\\Scripts\\cvoice.exe
