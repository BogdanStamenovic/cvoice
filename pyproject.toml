[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvoice"
version = "0.1.0"
description = "Clone a voice, then speak arbitrary text in it. Serbian-first, self-hosted."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["tts", "voice-cloning", "serbian", "omnivoice", "self-hosted"]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "yt-dlp>=2024.1.1",
    "tomli>=2.0; python_version<'3.11'",
]

# The server carries torch and the model; the client must stay installable on a
# laptop with no GPU, so the heavy half is an extra rather than a dependency.
[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "omnivoice",
]
asr = [
    "faster-whisper>=1.0",
    "jiwer>=3.0",
    # ctranslate2 links against the CUDA 12 runtime (libcublas.so.12), while
    # current torch wheels ship CUDA 13 (libcublas.so.13). Pulling the cu12
    # runtime in alongside is cheaper and less brittle than pinning torch back
    # to a cu12 build; cvoiced puts both on the linker path at startup.
    "nvidia-cublas-cu12; platform_system=='Linux' and platform_machine=='x86_64'",
    "nvidia-cudnn-cu12; platform_system=='Linux' and platform_machine=='x86_64'",
]

[project.scripts]
reci = "cvoice.cli_reci:main"
cvoice = "cvoice.cli_enrol:main"
cvoiced = "cvoice.server:main"

[project.urls]
Homepage = "https://github.com/BogdanStamenovic/cvoice"

[tool.hatch.build.targets.wheel]
packages = ["src/cvoice"]
