# Written by install.py when the venv lives on a mount other than / (on
# archserver: /mnt/offload, an ext4 image on the Windows partition). With that
# mount down, ExecStart dies 203/EXEC and restart-loops until the start limit
# kills it; hotline-ios then comes up with can_talk false, which presents as
# his phone ringing and not speaking rather than as a mount problem.
#
# RequiresMountsFor does NOT work here and was tried first: this is a USER unit,
# the .mount unit lives in the SYSTEM manager, and a user manager cannot pull a
# system unit. Verified 2026-09-20 by unmounting and starting the service --
# the mount stayed down and the service restart-looped. The dependency looked
# correct in `systemctl show` output while doing nothing, so check it by
# unmounting, not by reading the property.
#
# Hence an explicit ExecStartPre. It is bounded and fails fast rather than
# waiting: a previous ExecStartPre on hotline-ios burned the full 90s and
# systemd killed the start job before ExecStart ever ran (2026-09-11). If the
# disk is genuinely detached this fails immediately with a clear reason in the
# journal, which beats a daemon that starts and cannot speak.
[Unit]
RequiresMountsFor=

[Service]
ExecStartPre=/bin/sh -c 'mountpoint -q @MOUNT@ || sudo -n systemctl start @MOUNTUNIT@; mountpoint -q @MOUNT@ || { echo "cvoiced: @MOUNT@ is not mounted and could not be mounted; the venv lives there" >&2; exit 1; }'
